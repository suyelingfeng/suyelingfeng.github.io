<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f4f7f9"/><g fill="none" stroke="#d7e1e6"><path d="M80 80h1120M80 160h1120M80 240h1120M80 320h1120M80 400h1120M80 480h1120M80 560h1120"/><path d="M160 60v540M320 60v540M480 60v540M640 60v540M800 60v540M960 60v540M1120 60v540"/></g><text x="90" y="130" fill="#193243" font-family="Segoe UI,Microsoft YaHei" font-size="48" font-weight="700">STM32 轻量算法库</text><text x="92" y="178" fill="#55707f" font-family="Segoe UI,Microsoft YaHei" font-size="24">从传感器滤波、状态估计到闭环控制</text><g transform="translate(90 260)" font-family="Segoe UI,Microsoft YaHei"><g fill="#fff" stroke="#2e7188" stroke-width="3"><rect width="180" height="120" rx="8"/><rect x="250" width="180" height="120" rx="8"/><rect x="500" width="180" height="120" rx="8" stroke="#e06b3c"/><rect x="750" width="180" height="120" rx="8"/></g><rect x="1000" width="180" height="120" rx="8" fill="#193243"/><g text-anchor="middle" font-size="23" font-weight="600" fill="#193243"><text x="90" y="53">传感器</text><text x="340" y="53">滤波估计</text><text x="590" y="53">控制决策</text><text x="840" y="53">输出保护</text></g><text x="1090" y="53" text-anchor="middle" fill="#fff" font-size="23">执行器</text><g text-anchor="middle" font-size="17" fill="#637b88"><text x="90" y="84">ADC / IMU</text><text x="340" y="84">EMA / Kalman</text><text x="590" y="84">PID / LADRC</text><text x="840" y="84">Clamp / Slew</text></g><text x="1090" y="84" text-anchor="middle" fill="#c9d9e0" font-size="17">PWM / Motor</text><g stroke="#e06b3c" stroke-width="4" fill="#e06b3c"><path d="M180 60h70M430 60h70M680 60h70M930 60h70"/><path d="M250 60l-14-9v18zM500 60l-14-9v18zM750 60l-14-9v18zM1000 60l-14-9v18z"/></g></g><rect x="90" y="455" width="1090" height="115" rx="8" fill="#193243"/><g font-family="Consolas" font-size="20"><text x="118" y="493" fill="#80c8db">float estimate = Kalman_Filter(&amp;kf, measurement);</text><text x="118" y="525" fill="#f0a37f">float output = PID_Calc(&amp;pid, target, estimate);</text><text x="118" y="557" fill="#dce7ec">fixed memory · C99 · HAL independent · host tested</text></g><text x="90" y="665" fill="#55707f" font-family="Segoe UI" font-size="20">suyelingfeng / stm32_kalman-pid</text></svg>