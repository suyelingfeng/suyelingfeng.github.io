<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900"><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#253b48}.t{font-size:31px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#657781}.bad{fill:#f6eeee;stroke:#a87878;stroke-width:2}.good{fill:#e8f2ed;stroke:#567864;stroke-width:2}.row{fill:#fff;stroke:#a5b3ba;stroke-width:1.5}</style><rect width="720" height="900" fill="#f6f8f9"/><text x="360" y="54" text-anchor="middle" class="t">同一个故障，两种提问方式</text><text x="360" y="84" text-anchor="middle" class="s">增加有效信息，不增加无关篇幅</text>
<rect x="48" y="120" width="624" height="180" rx="12" class="bad"/><text x="80" y="162" class="h">模糊提问</text><text x="80" y="208" class="b">“STM32 程序一运行就死机，急，谁能看看？”</text><text x="80" y="254" class="s">缺少环境、触发条件、日志、排查结果和具体问题</text><text x="360" y="352" text-anchor="middle" class="h">整理后补充四类信息</text>
<rect x="48" y="382" width="624" height="72" rx="9" class="row"/><text x="78" y="426" class="h">01</text><text x="138" y="426" class="b">环境：STM32F103C8T6 + RT-Thread Nano</text><rect x="48" y="468" width="624" height="72" rx="9" class="row"/><text x="78" y="512" class="h">02</text><text x="138" y="512" class="b">目标：创建两个周期翻转 LED 的线程</text><rect x="48" y="554" width="624" height="72" rx="9" class="row"/><text x="78" y="598" class="h">03</text><text x="138" y="598" class="b">现象：创建第二个线程后进入 HardFault</text><rect x="48" y="640" width="624" height="72" rx="9" class="row"/><text x="78" y="684" class="h">04</text><text x="138" y="684" class="b">实验：线程栈改为 512 字节后故障消失</text>
<rect x="48" y="742" width="624" height="112" rx="12" class="good"/><text x="80" y="784" class="h">具体问题</text><text x="80" y="820" class="b">如何确认是否为线程栈不足，并测量最大栈用量？</text></svg>
