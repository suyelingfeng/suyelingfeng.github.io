<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#39798a"/></marker><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#253b48}.t{font-size:31px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#657781}.box{fill:#fff;stroke:#8ba0aa;stroke-width:2}.hi{fill:#e5f1f4;stroke:#39798a;stroke-width:2}.num{font-size:21px;font-weight:700;fill:#fff}</style></defs><rect width="720" height="980" fill="#f6f8f9"/><text x="360" y="54" text-anchor="middle" class="t">技术问题整理流程</text><text x="360" y="84" text-anchor="middle" class="s">把“无法运行”整理成别人可以分析的现场</text>
<g><rect x="58" y="122" width="604" height="104" rx="12" class="box"/><circle cx="105" cy="174" r="27" fill="#315e70"/><text x="105" y="182" text-anchor="middle" class="num">1</text><text x="150" y="164" class="h">明确目标</text><text x="150" y="196" class="b">一句话说明最终想完成什么</text><path d="M360 226v44" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/>
<rect x="58" y="280" width="604" height="104" rx="12" class="box"/><circle cx="105" cy="332" r="27" fill="#315e70"/><text x="105" y="340" text-anchor="middle" class="num">2</text><text x="150" y="322" class="h">记录环境</text><text x="150" y="354" class="b">系统、硬件、版本、工具链与依赖</text><path d="M360 384v44" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/>
<rect x="58" y="438" width="604" height="104" rx="12" class="hi"/><circle cx="105" cy="490" r="27" fill="#39798a"/><text x="105" y="498" text-anchor="middle" class="num">3</text><text x="150" y="480" class="h">稳定复现</text><text x="150" y="512" class="b">保留最短步骤、原始日志和触发条件</text><path d="M360 542v44" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/>
<rect x="58" y="596" width="604" height="104" rx="12" class="box"/><circle cx="105" cy="648" r="27" fill="#315e70"/><text x="105" y="656" text-anchor="middle" class="num">4</text><text x="150" y="638" class="h">搜索与实验</text><text x="150" y="670" class="b">查官方资料，逐项改变变量并记录结果</text><path d="M360 700v44" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/>
<rect x="58" y="754" width="604" height="104" rx="12" class="box"/><circle cx="105" cy="806" r="27" fill="#315e70"/><text x="105" y="814" text-anchor="middle" class="num">5</text><text x="150" y="796" class="h">区分事实与推测</text><text x="150" y="828" class="b">先写观察结果，再写当前判断</text><path d="M360 858v44" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/>
<rect x="58" y="912" width="604" height="52" rx="12" fill="#263d4b"/><text x="360" y="946" text-anchor="middle" class="h" style="fill:#fff">6 · 提出一个具体、可以回答的问题</text></g></svg>
