<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
<title id="title">turtlesim 接口关系图</title><desc id="desc">键盘节点通过速度话题控制仿真节点，仿真节点提供状态话题、服务和动作。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39798a"/></marker><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#253b48}.t{font-size:31px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#657781}.n{fill:#fff;stroke:#7f99a5;stroke-width:2}.p{fill:#e5f1f4;stroke:#39798a;stroke-width:2}.v{fill:#f4efe2;stroke:#8b7440;stroke-width:2}.g{fill:#e9f1e8;stroke:#52725a;stroke-width:2}</style></defs>
<rect width="720" height="900" fill="#f6f8f9"/><text x="360" y="54" text-anchor="middle" class="t">turtlesim 接口关系</text><text x="360" y="84" text-anchor="middle" class="s">同一节点可以同时发布、订阅并提供多种接口</text>
<rect x="60" y="122" width="600" height="112" rx="12" class="n"/><text x="360" y="164" text-anchor="middle" class="h">/teleop_turtle</text><text x="360" y="198" text-anchor="middle" class="b">读取方向键，生成速度指令</text>
<path d="M360 234V286" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/><rect x="92" y="296" width="536" height="104" rx="12" class="p"/><text x="360" y="338" text-anchor="middle" class="h">Topic · /turtle1/cmd_vel</text><text x="360" y="372" text-anchor="middle" class="b">geometry_msgs/msg/Twist</text>
<path d="M360 400V452" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="462" width="600" height="116" rx="12" class="n"/><text x="360" y="506" text-anchor="middle" class="h">/turtlesim</text><text x="360" y="542" text-anchor="middle" class="b">更新海龟状态并绘制仿真画面</text>
<path d="M180 578V632M360 578V632M540 578V632" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/>
<rect x="36" y="642" width="208" height="176" rx="12" class="p"/><text x="140" y="682" text-anchor="middle" class="h">状态话题</text><text x="140" y="720" text-anchor="middle" class="b">/turtle1/pose</text><text x="140" y="752" text-anchor="middle" class="b">/color_sensor</text><text x="140" y="786" text-anchor="middle" class="s">连续发布状态</text>
<rect x="256" y="642" width="208" height="176" rx="12" class="v"/><text x="360" y="682" text-anchor="middle" class="h">服务</text><text x="360" y="720" text-anchor="middle" class="b">/spawn</text><text x="360" y="752" text-anchor="middle" class="b">/set_pen</text><text x="360" y="786" text-anchor="middle" class="s">一次请求与响应</text>
<rect x="476" y="642" width="208" height="176" rx="12" class="g"/><text x="580" y="682" text-anchor="middle" class="h">动作</text><text x="580" y="720" text-anchor="middle" class="b">rotate_absolute</text><text x="580" y="754" text-anchor="middle" class="s">目标 · 反馈 · 结果</text><text x="580" y="786" text-anchor="middle" class="s">执行中可取消</text>
<text x="360" y="864" text-anchor="middle" class="s">观察顺序：node list → node info → topic / service / action</text></svg>
