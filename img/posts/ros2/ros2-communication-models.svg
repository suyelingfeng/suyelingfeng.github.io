<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ROS 2 四类常用交互方式</title>
  <desc id="desc">对比话题、服务、动作和参数的关系、数据方向与典型用途。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#385a78"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f8fa"/>
  <g font-family="Microsoft YaHei,Noto Sans SC,sans-serif" fill="#172033">
    <text x="640" y="54" text-anchor="middle" font-size="30" font-weight="700">ROS 2 四类常用交互方式</text>
    <text x="640" y="86" text-anchor="middle" font-size="16" fill="#627086">先根据数据语义选模型，再考虑接口类型和 QoS</text>

    <g stroke="#31445f" stroke-width="2" fill="#ffffff">
      <rect x="70" y="122" width="550" height="236" rx="8"/>
      <rect x="660" y="122" width="550" height="236" rx="8"/>
      <rect x="70" y="390" width="550" height="236" rx="8"/>
      <rect x="660" y="390" width="550" height="236" rx="8"/>
    </g>

    <g font-size="20" font-weight="700">
      <text x="100" y="161">话题 Topic</text><text x="690" y="161">服务 Service</text>
      <text x="100" y="429">动作 Action</text><text x="690" y="429">参数 Parameter</text>
    </g>
    <g font-size="15" fill="#657387">
      <text x="100" y="188">连续数据流 · 发布 / 订阅 · 多对多</text>
      <text x="690" y="188">短时请求 · 请求 / 响应</text>
      <text x="100" y="456">长任务 · 目标 / 反馈 / 结果 · 可取消</text>
      <text x="690" y="456">节点配置 · 读取 / 修改 / 监听变化</text>
    </g>

    <g stroke="#385a78" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M205 262 H458"/>
      <path d="M795 242 H1060"/><path d="M1060 286 H795"/>
      <path d="M205 526 H458"/><path d="M458 568 H205"/>
      <path d="M795 526 H1060"/><path d="M1060 568 H795"/>
    </g>
    <g font-size="16" text-anchor="middle">
      <rect x="115" y="224" width="90" height="72" rx="6" fill="#eaf2f5" stroke="#5a7884"/><text x="160" y="266">发布者</text>
      <rect x="458" y="224" width="100" height="72" rx="6" fill="#eaf2f5" stroke="#5a7884"/><text x="508" y="266">订阅者</text>
      <text x="330" y="251" fill="#385a78">消息流</text>

      <rect x="705" y="224" width="90" height="72" rx="6" fill="#e8edf5" stroke="#5a6884"/><text x="750" y="266">客户端</text>
      <rect x="1060" y="224" width="100" height="72" rx="6" fill="#e8edf5" stroke="#5a6884"/><text x="1110" y="266">服务端</text>
      <text x="925" y="231" fill="#385a78">请求</text><text x="925" y="304" fill="#385a78">响应</text>

      <rect x="115" y="492" width="90" height="92" rx="6" fill="#f3ece5" stroke="#8b6b50"/><text x="160" y="544">客户端</text>
      <rect x="458" y="492" width="100" height="92" rx="6" fill="#f3ece5" stroke="#8b6b50"/><text x="508" y="544">动作端</text>
      <text x="330" y="515" fill="#385a78">目标</text><text x="330" y="589" fill="#385a78">反馈 / 结果</text>

      <rect x="705" y="492" width="90" height="92" rx="6" fill="#eef1e8" stroke="#70805b"/><text x="750" y="544">工具</text>
      <rect x="1060" y="492" width="100" height="92" rx="6" fill="#eef1e8" stroke="#70805b"/><text x="1110" y="544">节点</text>
      <text x="925" y="515" fill="#385a78">读取 / 设置</text><text x="925" y="589" fill="#385a78">值 / 事件</text>
    </g>
    <g font-size="15" fill="#657387">
      <text x="100" y="333">例：图像、激光雷达、里程计、机器人状态</text>
      <text x="690" y="333">例：查询状态、切换模式、执行快速计算</text>
      <text x="100" y="601">例：导航到目标点、机械臂执行轨迹</text>
      <text x="690" y="601">例：阈值、坐标系名称、控制周期</text>
    </g>
  </g>
</svg>
