<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
<title id="title">C++ 发布订阅练习数据流</title><desc id="desc">定时器触发发布节点生成整数消息，经话题传给订阅节点并触发回调。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39798a"/></marker><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#253b48}.t{font-size:31px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:17px;fill:#657781}.n{fill:#fff;stroke:#849da8;stroke-width:2}.p{fill:#e5f1f4;stroke:#39798a;stroke-width:2}</style></defs>
<rect width="720" height="760" fill="#f6f8f9"/><text x="360" y="54" text-anchor="middle" class="t">C++ 发布 / 订阅数据流</text><text x="360" y="84" text-anchor="middle" class="s">从定时器触发到订阅回调执行</text>
<rect x="72" y="122" width="576" height="100" rx="12" class="n"/><text x="360" y="162" text-anchor="middle" class="h">1 · Wall Timer</text><text x="360" y="194" text-anchor="middle" class="b">每 1 秒触发 publish_number()</text>
<path d="M360 222V274" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/><rect x="72" y="284" width="576" height="112" rx="12" class="n"/><text x="360" y="326" text-anchor="middle" class="h">2 · number_publisher</text><text x="360" y="360" text-anchor="middle" class="b">构造 Int32 消息并递增 count</text>
<path d="M360 396V448" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/><rect x="72" y="458" width="576" height="112" rx="12" class="p"/><text x="360" y="500" text-anchor="middle" class="h">3 · /practice/count</text><text x="360" y="534" text-anchor="middle" class="b">消息类型和 QoS 是双方共同遵守的约定</text>
