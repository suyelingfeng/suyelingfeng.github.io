<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#39798a"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#253b48}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#61737d}.card{fill:#fff;stroke:#9bafb9;stroke-width:2}.node{fill:#e6f2f4;stroke:#4e8796;stroke-width:2}</style></defs><rect width="720" height="1320" fill="#f6f8f9"/><text x="360" y="55" text-anchor="middle" class="t">ROS 2 四类常用交互方式</text><text x="360" y="86" text-anchor="middle" class="s">根据数据特征选择接口</text><g transform="translate(42 118)"><rect width="636" height="260" rx="12" class="card"/><text x="30" y="43" class="h">01 · Topic 话题</text><text x="30" y="76" class="b">连续数据流 · 发布 / 订阅</text><rect x="50" y="100" width="190" height="62" rx="8" class="node"/><text x="145" y="138" text-anchor="middle" class="b">相机节点</text><path d="M250 131h132" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/><rect x="396" y="100" width="190" height="62" rx="8" class="node"/><text x="491" y="138" text-anchor="middle" class="b">视觉节点</text><text x="50" y="205" class="b">适合：传感器、状态流、控制指令</text><text x="50" y="235" class="s">异步，可一对多，通常不等待回复</text></g><g transform="translate(42 402)"><rect width="636" height="260" rx="12" class="card"/><text x="30" y="43" class="h">02 · Service 服务</text><text x="30" y="76" class="b">短事务 · 请求 / 响应</text><rect x="50" y="100" width="190" height="62" rx="8" class="node"/><text x="145" y="138" text-anchor="middle" class="b">客户端</text><path d="M250 118h132M382 148H250" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/><rect x="396" y="100" width="190" height="62" rx="8" class="node"/><text x="491" y="138" text-anchor="middle" class="b">服务端</text><text x="50" y="205" class="b">适合：切换模式、查询、一次性操作</text><text x="50" y="235" class="s">调用应在较短时间内完成</text></g><g transform="translate(42 686)"><rect width="636" height="282" rx="12" class="card"/><text x="30" y="43" class="h">03 · Action 动作</text><text x="30" y="76" class="b">长任务 · 持续反馈 · 可取消</text><rect x="50" y="100" width="190" height="62" rx="8" class="node"/><text x="145" y="138" text-anchor="middle" class="b">导航客户端</text><path d="M250 118h132M382 148H250" stroke="#39798a" stroke-width="3" marker-end="url(#a)"/><rect x="396" y="100" width="190" height="62" rx="8" class="node"/><text x="491" y="138" text-anchor="middle" class="b">导航服务端</text><text x="50" y="205" class="b">适合：导航、机械臂轨迹、长时间标定</text><text x="50" y="235" class="s">发送目标 → 周期反馈 → 返回结果</text><text x="50" y="263" class="s">执行中可以取消或抢占</text></g><g transform="translate(42 992)"><rect width="636" height="280" rx="12" class="card"/><text x="30" y="43" class="h">04 · Parameter 参数</text><text x="30" y="76" class="b">节点配置 · 运行时调整</text><rect x="50" y="100" width="536" height="66" rx="8" class="node"/><text x="318" y="127" text-anchor="middle" class="b">camera_node</text><text x="318" y="151" text-anchor="middle" class="s">exposure = 18 ms · frame_rate = 30 Hz</text><text x="50" y="210" class="b">适合：阈值、频率、模式等配置</text><text x="50" y="240" class="s">明确类型和有效范围，不承载高频数据</text></g></svg>